<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PhishGuard</title>

  <link rel="stylesheet" href="phishguard.css">
</head>

<body>

  <div class="container">

    <h1>PhishGuard</h1>

    <p class="subtitle">
      Train yourself to detect phishing emails and improve your cyber security awareness.
    </p>

    <div class="top-bar">

      <div class="difficulty">
        Difficulty:
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="timer">
        Time Left:
        <span id="timer">15</span>s
      </div>

      <button class="theme-btn" onclick="toggleTheme()">
        Toggle Mode
      </button>

    </div>

    <div class="email-box">

      <div class="email-header" id="emailHeader"></div>

      <div class="email-content" id="emailContent"></div>

    </div>

    <div class="buttons">

      <button class="safe" onclick="checkAnswer('safe')">
        Safe
      </button>

      <button class="phishing" onclick="checkAnswer('phishing')">
        Phishing
      </button>

      <button class="hint-btn" onclick="showHint()">
        Hint
      </button>

    </div>

    <div class="result" id="resultBox"></div>

    <div class="hint-box" id="hintBox"></div>

    <button class="next-btn" id="nextBtn" onclick="nextEmail()">
      Next Email
    </button>

    <button class="restart-btn" id="restartBtn" onclick="restartGame()">
      Restart Training
    </button>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <div class="badge" id="badge"></div>

    <div class="stats">

      <div class="stat-box">
        <h2 id="score">0</h2>
        <p>Score</p>
      </div>

      <div class="stat-box">
        <h2 id="correct">0</h2>
        <p>Correct</p>
      </div>

      <div class="stat-box">
        <h2 id="wrong">0</h2>
        <p>Wrong</p>
      </div>

      <div class="stat-box">
        <h2 id="streak">0</h2>
        <p>Streak</p>
      </div>

      <div class="stat-box">
        <h2 id="highScore">0</h2>
        <p>High Score</p>
      </div>

    </div>

  </div>

  <script src="phishguard.js"></script>

</body>
</html>
